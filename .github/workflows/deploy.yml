name: CI/CD Deploy to Vercel

on:
  push:
    branches:
      - main
      - master
  pull_request:
    branches:
      - main
      - master

jobs:
  ci:
    name: Lint & Test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install Dependencies
        run: npm ci

      - name: Check TypeScript & Lint
        run: npm run lint

      - name: Run Unit Tests
        run: npm run test

  deploy:
    name: Deploy to Vercel
    needs: ci
    runs-on: ubuntu-latest
    env:
      VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
      VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
      VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Validate Vercel Secrets
        run: |
          if [ -z "$VERCEL_TOKEN" ]; then
            echo "❌ Lỗi: Chưa cấu hình VERCEL_TOKEN trong GitHub Secrets."
            echo "Vui lòng vào Settings -> Secrets and variables -> Actions và thêm VERCEL_TOKEN"
            exit 1
          fi

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install Dependencies
        run: npm ci

      - name: Install Vercel CLI
        run: npm install --global vercel@latest

      # Preview Deployment (cho Pull Request)
      - name: Pull Vercel Environment Information (Preview)
        if: github.event_name == 'pull_request'
        run: vercel pull --yes --environment=preview

      - name: Build Project Artifacts (Preview)
        if: github.event_name == 'pull_request'
        run: vercel build

      - name: Deploy to Vercel (Preview)
        if: github.event_name == 'pull_request'
        run: vercel deploy --prebuilt

      # Production Deployment (khi push vào main/master)
      - name: Pull Vercel Environment Information (Production)
        if: github.event_name == 'push'
        run: vercel pull --yes --environment=production

      - name: Build Project Artifacts (Production)
        if: github.event_name == 'push'
        run: vercel build --prod

      - name: Deploy to Vercel (Production)
        if: github.event_name == 'push'
        run: vercel deploy --prebuilt --prod
